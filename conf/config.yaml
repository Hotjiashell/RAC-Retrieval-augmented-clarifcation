  run_name: run_${mode}_${dataset.name}_${now:%Y-%m-%d}_${now:%H-%M-%S}
  disabled: false
  mode: offline


dataset:
  name: "paqa"
  resolved_qulac_path: "/home/kebir/RAC/Data-generation/qulac_resolved.json"
  # fine_tune_path: "/home/kebir/RAC/gen-neg-examples/fine_tune_dataset.json"
  fine_tune_path: "/home/kebir/RAC/gen-neg-examples/Paqa/passage_evidence_train_answer.json"
  # fine_tune_path1: "/home/kebir/RAC/Data-generation/fine_tune_dataset.csv"
  paqa_relevance_dataset: "/home/kebir/RAC/gen-neg-examples/passage_evidence_train_answer.json"
  # eval_dataset: "/home/kebir/RAC/gen-neg-examples/eval_dataset.json"
  # eval_dataset: "/home/kebir/RAC/gen-neg-examples/test_generated_data_paqa_0.4_alpha.json"
  # eval_dataset: "/home/kebir/RAC/gen-neg-examples/preference_tuning_test_generated_data_paqa_0.3alpha_half_train2.json"
  eval_dataset: "preference_tuning_test_generated_data_paqa_0.3alpha_half_train2_fixed.json"
  #dpo_dataset: evaluation_datasets/evaluation_generated_data_${dataset.name}_split_${dataset.train_test_split}_alpha${mixture.alpha}_beta_${dpo.beta}_loss_${dpo.loss}_lr_${dpo.learning_rate}schedule_${dpo.lr_scheduler_type}_epochs_${dpo.num_epochs}.json
  #dpo_dataset: evaluation_datasets/evaluation_generated_data_${dataset.name}_split_${dataset.train_test_split}_alpha${mixture.alpha}_beta_${dpo.beta}_loss_${dpo.loss}.json
  dpo_dataset: evaluation_datasets/evaluation_generated_data_${dataset.name}/${run.gen_run_id}/${run.eval_run_id}/split_${dataset.train_test_split}_alpha${mixture.alpha}__lr_${model.learning_rate}schedule_${model.lr_scheduler_type}_epochs_${model.num_epochs}_beta_${dpo.beta}_loss_${dpo.loss}_lr_${dpo.learning_rate}schedule_${dpo.lr_scheduler_type}_epochs_${dpo.num_epochs}.json
  preference_dataset: dpo_datasets/preference_tuning_test_generated_data_${dataset.name}/${run.gen_run_id}/split_${dataset.train_test_split}_alpha${mixture.alpha}_lr_${model.learning_rate}schedule_${model.lr_scheduler_type}_epochs_${model.num_epochs}.json
  #preference_dataset: dpo_datasets/preference_tuning_test_generated_data_${dataset.name}_split_${dataset.train_test_split}_alpha${mixture.alpha}.json
  mixture_dataset: preference_datasets/preference_tuning_test_generated_data_paqa_0.3alpha_half_train2_fixed.json
  evaluation_dataset: evaluation_datasets/evaluation_generated_data_${dataset.name}/${run.gen_run_id}/${run.eval_run_id}/split_${dataset.train_test_split}_alpha${mixture.alpha}_beta_${dpo.beta}_loss_${dpo.loss}.json
  full_sft_eval_dataset: sft_eval_datasets/${dataset.name}/${run.eval_run_id}/split_${dataset.train_test_split}_alpha${mixture.alpha}_lr_${model.learning_rate}schedule_${model.lr_scheduler_type}_epochs_${model.num_epochs}.json
