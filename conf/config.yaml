  metrics: metrics/metrics_results_${dataset.name}/${run.gen_run_id}/${run.eval_run_id}/split_${dataset.train_test_split}_alpha${mixture.alpha}model__lr_${model.learning_rate}schedule_${model.lr_scheduler_type}_epochs_${model.num_epochs}_beta_${dpo.beta}_loss_${dpo.loss}_lr_${dpo.learning_rate}schedule_${dpo.lr_scheduler_type}_epochs_${dpo.num_epochs}
