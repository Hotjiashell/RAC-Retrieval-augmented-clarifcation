  llm_judge_output_path: llm_judge/${dataset.name}/${run.gen_run_id}/${run.eval_run_id}/split_${dataset.train_test_split}_alpha${mixture.alpha}model__lr_${model.learning_rate}schedule_${model.lr_scheduler_type}_epochs_${model.num_epochs}_beta_${dpo.beta}_loss_${dpo.loss}_lr_${dpo.learning_rate}schedule_${dpo.lr_scheduler_type}_epochs_${dpo.num_epochs}
  seed: 42
  train_test_split: 0.5


retrieval:
  metrics: ['map', 'ndcg', 'P_1', 'P_5', 'P_10', 'recall_1', 'recall_5', 'recall_10', 'recip_rank', 'Rprec', 'bpref']
  method: "all_relevant"
  query: "topic + facet + question"
  relevance_path: "/home/kebir/datasets/qulac/data/qulac/faceted.qrel"
  qulac_path: "/home/kebir/datasets/qulac/data/qulac/qulac.json"
  resolved_qulac_path: "/home/kebir/RAC/Data-generation/qulac_resolved.json"
  facet: null
  index_path: "/home/kebir/RAC/Data-generation/indexes/clueweb09-passages"
  separate_index_folder: "/home/kebir/RAC/Data-generation/tst-index"
  top_k: null
  bm25:
    k1: null
    b: null
  rm3:
    fb_terms: 10
    fb_docs: 10
    fb_weights: 0.5
  set: True
  rank: True
model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  tokenizer_name: "meta-llama/Llama-3.2-1B-Instruct"
  pad_token: "<|finetune_right_pad_id|>"
  chat: False
  response_template: "Clarifying Question:"
  name1: "meta-llama/Meta-Llama-3.1-8B"
  Qlora: False
  max_seq_length: 3840
  batch_size: 2
  num_epochs: 2
  learning_rate: 1e-6
  log_level: info
  logging_steps: 10
  lr_scheduler_type: linear  
  logging_dir: "./logs"
  # output_dir: "./model"
  output_dir: checkpoint_sft_${model.name}_${dataset.name}_split_${dataset.train_test_split}_QLORA_${model.Qlora}
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  evaluation_strategy: "steps"
  save_steps: 100
  eval_steps: 100
  save_total_limit: 1
  weight_decay: 0.001
  optim: adamw_torch
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  seed: 12357
  warmup_ratio: 0.1
  fp16: False
  bf16: True
  load_directory1: qlora-checkpoint
  load_directory2: qlora_checkpoint_paqa2
  # load_directory: qlora_checkpoint_paqa2
  # save_directory: qlora_checkpoint_paqa2
  # load_directory: "./model"
  load_directory: checkpoint_sft_${model.name}_${dataset.name}_split_${dataset.train_test_split}_QLORA_${model.Qlora}_lr_${model.learning_rate}_epoch_${model.num_epochs}
  uncond_save_directory: uncond_sft_${model.name}_${dataset.name}_split_${dataset.train_test_split}_lr_${model.learning_rate}_epoch_${model.num_epochs}
  # load_directory: qlora_checkpoint_paqa_sft_half_train
  # save_directory: qlora_checkpoint_paqa_sft_half_train
  save_directory: checkpoint_sft_${model.name}_${dataset.name}_split_${dataset.train_test_split}_QLORA_${model.Qlora}_lr_${model.learning_rate}_epoch_${model.num_epochs}
  dpo_directory: checkpoint_dpo_${model.name}_${dataset.name}_split_${dataset.train_test_split}_alpha${mixture.alpha}_QLORA_${model.Qlora}_lr_${model.learning_rate}_epoch_${model.num_epochs}_${dpo.beta}_loss_${dpo.loss}
  fsdp_config: /linkhome/rech/genisi01/uyy82al/.cache/huggingface/accelerate/default_config.yaml


dpo:
  max_seq_length: 3840
  batch_size: 2
  num_epochs: 1
  learning_rate: 1e-6
  log_level: info
  logging_steps: 1
  lr_scheduler_type: linear  
  logging_dir: "./logs"
  output_dir: checkpoint_dpo_${model.name}_${dataset.name}_split_${dataset.train_test_split}_alpha${mixture.alpha}_QLORA_${model.Qlora}_lr_${model.learning_rate}_epoch_${model.num_epochs}_${dpo.beta}_loss_${dpo.loss}
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  evaluation_strategy: "steps"
  save_steps: 100
  eval_steps: 100
  save_total_limit: 1
  # weight_decay: 0.001
  optim: adamw_torch
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  seed: 12357
  warmup_ratio: 0.1
  fp16: False
  bf16: False
  dpo_directory: ckp_dpo_${model.name}_${dataset.name}_${run.gen_run_id}_split_${dataset.train_test_split}_alpha${mixture.alpha}_lr_${model.learning_rate}_epoch_${model.num_epochs}_${dpo.beta}_loss_${dpo.loss}
  beta: 0.1
  loss: "sigmoid"
  loss_type: "ipo"
  untouched: 6


mixture:
  alpha: 0.4
  bs: 150
  mn_bs: 150
  dpo_bs: 150
  num_variants: 1

  # save_directory: qlora-checkpoint

